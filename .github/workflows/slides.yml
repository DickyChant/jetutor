name: slides
# Render the comparison deck (Typst) to crisp SVG slides + PDF and publish a web slide viewer
# to GitHub Pages. Enable once: Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['docs/slides/**', '.github/workflows/slides.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install deck fonts (DejaVu Sans)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - uses: typst-community/setup-typst@v4

      - name: Render deck -> SVG slides + PDF
        working-directory: docs/slides
        run: |
          rm -rf _site && mkdir -p _site
          # crisp vector slides, one SVG per page (zero-padded index)
          typst compile jetclass_editions.typ '_site/slide-{0p}.svg'
          typst compile jetclass_editions.typ '_site/jetclass_editions.pdf'
          cp web/index.html _site/index.html
          # manifest = ordered list of slide SVGs, for the viewer to load
          (cd _site && ls slide-*.svg | sort | sed 's/.*/"&"/' | paste -sd, - | sed 's/^/[/;s/$/]/' > manifest.json)
          echo "rendered $(ls _site/slide-*.svg | wc -l) slides"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/slides/_site

      - id: deployment
        uses: actions/deploy-pages@v4
