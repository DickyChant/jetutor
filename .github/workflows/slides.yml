name: slides
# Render the comparison deck (Typst) and publish it to GitHub Pages.
# Enable once in the repo: Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['docs/slides/**', '.github/workflows/slides.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install deck fonts (DejaVu Sans)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - uses: typst-community/setup-typst@v4

      - name: Render deck -> PDF + per-slide PNGs
        working-directory: docs/slides
        run: |
          mkdir -p _site
          typst compile jetclass_editions.typ _site/jetclass_editions.pdf
          typst compile jetclass_editions.typ '_site/slide-{0p}.png' --ppi 150

      - name: Build landing page
        working-directory: docs/slides
        run: |
          cd _site
          {
            echo '<!doctype html><meta charset=utf-8><title>JetClass editions — comparison</title>'
            echo '<style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f7;color:#1a1a1a}'
            echo 'header{padding:18px 24px;background:#0b3d91;color:#fff}header a{color:#cfe0ff}'
            echo 'main{max-width:1100px;margin:0 auto;padding:20px}img{width:100%;margin:14px 0;'
            echo 'box-shadow:0 1px 6px rgba(0,0,0,.15);border-radius:4px}</style>'
            echo '<header><b>jetutor</b> — JetClass generator editions · <a href="jetclass_editions.pdf">download PDF</a></header><main>'
            for f in $(ls slide-*.png | sort); do echo "<img src=\"$f\">"; done
            echo '</main>'
          } > index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/slides/_site

      - id: deployment
        uses: actions/deploy-pages@v4
