# JetClass-SHERPA: TTBarLep (boosted top pair, leptonic)  [FIXED decay forcing]
# The old config forced W -> qq AND W -> l nu, so the kept (hadronic-top) jets landed as
# Top_bqq and collapsed onto TTBar. Force ONLY the leptonic W channels so both tops -> b l nu
# (=> Top_bln jets, distinct from TTBar's Top_bqq). t -> b W is the only top channel (implicit).
# Full event generation: ME (Comix) + hard decays + PS + hadronization + UE -> HepMC3. 13 TeV.
BEAMS: 2212
BEAM_ENERGIES: 6500
EVENTS: 1000
ME_GENERATORS: [Comix]
PDF_LIBRARY: LHAPDFSherpa
PDF_SET: NNPDF23_lo_as_0130_qed
MPI_PDF_LIBRARY: LHAPDFSherpa
MPI_PDF_SET: NNPDF23_lo_as_0130_qed
EVENT_OUTPUT: HepMC3_GenEvent[events]
PARTICLE_DATA: {6: {Width: 0}}
HARD_DECAYS:
  Enabled: true
  Use_HO_SM_Widths: false
  Apply_Branching_Ratios: false
  Channels:
    # W (from t -> b W) -> l nu only (e/mu)  => both tops leptonic.
    # NOTE: Sherpa orders the channel as (W, nu, l): 24,12,-11 = W+ -> ve e+  (NOT 24,-11,12).
    24,12,-11: {Status: 2}
    24,14,-13: {Status: 2}
    -24,-12,11: {Status: 2}
    -24,-14,13: {Status: 2}
PROCESSES:
- 93 93 -> 6 -6:
    Order: {QCD: 2, EW: 0}
SELECTORS:
- [PT, 6, 450.0, E_CMS]
