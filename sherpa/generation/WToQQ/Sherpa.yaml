# JetClass-SHERPA: WToQQ (boosted W->qq, MET>450)
# Full event generation: ME (Comix) + hard decays + parton shower + hadronization
# + underlying event -> HepMC3.  PDF nn23lo1 (validated vs MadGraph).  13 TeV.
BEAMS: 2212
BEAM_ENERGIES: 6500
EVENTS: 1000
ME_GENERATORS: [Comix]
PDF_LIBRARY: LHAPDFSherpa
PDF_SET: NNPDF23_lo_as_0130_qed
MPI_PDF_LIBRARY: LHAPDFSherpa
MPI_PDF_SET: NNPDF23_lo_as_0130_qed
EVENT_OUTPUT: HepMC3_GenEvent[events]
PARTICLE_DATA: {6: {Width: 0}}
PARTICLE_CONTAINERS: {99: {Name: Wpm, Flavs: [24, -24]}}
HARD_DECAYS:
  Enabled: true
  Use_HO_SM_Widths: false
  Channels:
    24,2,-1: {Status: 2}
    24,4,-3: {Status: 2}
    -24,-2,1: {Status: 2}
    -24,-4,3: {Status: 2}
PROCESSES:
- 93 93 -> 12 -12 24:
    Order: {QCD: 0, EW: 3}
- 93 93 -> 12 -12 -24:
    Order: {QCD: 0, EW: 3}
SELECTORS:
- [PT, 99, 450.0, E_CMS]
